<section class="card">
  <h1>{{ registering() ? i18n.t('login.register.title') : i18n.t('login.signIn.title') }}</h1>
  <p class="subtitle">
    {{ registering() ? i18n.t('login.register.subtitle') : i18n.t('login.signIn.subtitle') }}
  </p>

  <form (ngSubmit)="submit()">
    @if (registering()) {
      <label>
        {{ i18n.t('login.field.displayName') }}
        <input
          name="displayName"
          [ngModel]="displayName()"
          (ngModelChange)="displayName.set($event)"
          autocomplete="name"
        />
      </label>
    }

    <label>
      {{ i18n.t('login.field.email') }}
      <input
        name="email"
        type="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        autocomplete="username"
      />
    </label>

    <label>
      {{ i18n.t('login.field.password') }}
      <span class="password-field">
        <input
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          [attr.autocomplete]="registering() ? 'new-password' : 'current-password'"
        />

        <!--
          The label says what pressing it will do, not what the field is doing now, because that is
          what a button's name is read as.
        -->
        <button
          type="button"
          class="reveal"
          [attr.aria-pressed]="showPassword()"
          (click)="togglePasswordVisibility()"
        >
          {{ showPassword() ? i18n.t('login.hidePassword') : i18n.t('login.showPassword') }}
        </button>
      </span>

      @if (registering()) {
        <span class="hint">{{ i18n.t('login.passwordHint', { count: minPasswordLength }) }}</span>
      }
    </label>

    @if (error(); as message) {
      <p class="notice error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="primary block" [disabled]="busy()">
      {{
        busy()
          ? i18n.t('login.submit.busy')
          : registering()
            ? i18n.t('login.submit.register')
            : i18n.t('login.submit.signIn')
      }}
    </button>
  </form>

  <button type="button" class="link" (click)="toggleMode()">
    {{ registering() ? i18n.t('login.toggle.toSignIn') : i18n.t('login.toggle.toRegister') }}
  </button>
</section>
