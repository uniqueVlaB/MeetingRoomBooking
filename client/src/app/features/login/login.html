<section class="card">
  <h1>{{ registering() ? 'Create an account' : 'Sign in' }}</h1>
  <p class="subtitle">
    {{ registering() ? 'New accounts can view rooms and book slots.' : 'Book a meeting room.' }}
  </p>

  <form (ngSubmit)="submit()">
    @if (registering()) {
      <label>
        Display name
        <input
          name="displayName"
          [ngModel]="displayName()"
          (ngModelChange)="displayName.set($event)"
          autocomplete="name"
        />
      </label>
    }

    <label>
      Email
      <input
        name="email"
        type="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        autocomplete="username"
      />
    </label>

    <label>
      Password
      <span class="password-field">
        <input
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          [attr.autocomplete]="registering() ? 'new-password' : 'current-password'"
        />

        <!--
          The label says what pressing it will do, not what the field is doing now, because that is
          what a button's name is read as.
        -->
        <button
          type="button"
          class="reveal"
          [attr.aria-pressed]="showPassword()"
          (click)="togglePasswordVisibility()"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </span>

      @if (registering()) {
        <span class="hint">At least {{ minPasswordLength }} characters.</span>
      }
    </label>

    @if (error(); as message) {
      <p class="notice error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="primary block" [disabled]="busy()">
      {{ busy() ? 'Please wait…' : registering() ? 'Create account' : 'Sign in' }}
    </button>
  </form>

  <button type="button" class="link" (click)="toggleMode()">
    {{ registering() ? 'I already have an account' : 'Create an account instead' }}
  </button>
</section>
