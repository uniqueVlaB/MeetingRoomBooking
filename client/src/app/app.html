<!--
  The first thing a keyboard user reaches, and invisible until then. Without it every page begins
  with the brand and up to four navigation links to tab past before reaching anything on the page.
-->
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="app-header">
  <a class="brand" routerLink="/rooms">
    <span class="brand-mark" aria-hidden="true">▦</span>
    Meeting Rooms
  </a>

  @if (auth.isAuthenticated()) {
    <nav class="nav" aria-label="Main">
      <a routerLink="/rooms" routerLinkActive="active">Rooms</a>
      <a routerLink="/my-bookings" routerLinkActive="active">My bookings</a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      }
    </nav>

    <div class="account">
      <span class="who">
        {{ auth.displayName() }}
        @if (auth.isAdmin()) {
          <span class="badge">Admin</span>
        }
      </span>
      <button type="button" class="ghost" (click)="signOut()">Sign out</button>
    </div>
  }
</header>

<!--
  tabindex="-1" so the skip link and the route change below can move focus here. It is not reachable
  by tabbing, so it never joins the tab order itself.
-->
<main #main class="app-main" id="main-content" tabindex="-1">
  <router-outlet />
</main>
