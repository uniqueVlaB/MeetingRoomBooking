name: CI

# Runs on every pull request and on pushes to any branch except Deploy. Pushes to Deploy are handled
# by deploy.yml, which runs the same build and test gate before it deploys anything.
on:
  pull_request:
  push:
    branches-ignore: [Deploy]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test the backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MeetingRoomBooking.slnx

      - name: Build
        # Warnings are errors, so this also enforces the code style.
        run: dotnet build MeetingRoomBooking.slnx --configuration Release --no-restore

      - name: Test
        # The concurrency tests need a real SQL Server. GitHub's Ubuntu runners provide Docker, so
        # Testcontainers starts one; no MEETINGROOMS_TEST_SQL override is needed here.
        run: dotnet test MeetingRoomBooking.slnx --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Check, test and build the client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Check formatting
        # The repository carries a Prettier configuration; without this it was advisory only, and
        # formatting drifted file by file.
        working-directory: client
        run: npm run format:check

      - name: Lint
        # The backend has had warnings-as-errors from the start. This is the client's half of it.
        working-directory: client
        run: npm run lint

      - name: Test
        working-directory: client
        run: npm test -- --no-watch

      - name: Build
        working-directory: client
        run: npm run build
